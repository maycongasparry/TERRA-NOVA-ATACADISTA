<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terra Nova Distribuidora</title>
  <style>
    :root{font:15px system-ui,sans-serif;color:#183032;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#143c37;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}small{color:#71817d}header small{color:#b9d8d0}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px;background:#fff;border-bottom:1px solid #dce7e2}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#177b61;color:white;font:inherit}button.secondary{background:#e5f0ec;color:#174e42}nav button{background:transparent;color:#31564d}nav button.active{background:#dcefe7;color:#0d674e}main{max-width:1200px;margin:26px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #dde7e2;border-radius:12px;padding:20px;margin-bottom:16px}.card strong{font-size:23px;display:block;margin-top:8px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{display:block;font-size:13px;font-weight:600;margin:8px 0}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid #bdccc5;border-radius:7px;background:white;font:inherit;margin-top:5px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e3ebe7}th{color:#526a63;font-size:12px;text-transform:uppercase} .table-wrap{overflow:auto}.badge{display:inline-block;background:#e5f0ec;border-radius:20px;padding:4px 9px;font-size:12px}.warn{background:#fff0cf;color:#805400}.danger{background:#fce3df;color:#96362c}.muted{color:#688078}.error{color:#a42b25}.success{color:#087453}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:7px 9px}h2{margin:0 0 16px;font-size:22px}h3{margin:0 0 12px}form{margin:0}.notice{padding:12px;background:#eaf4f0;border-radius:8px;margin:10px 0}footer{padding:20px;text-align:center;color:#72857c}
  </style>
</head>
<body><header><div><h1>Terra Nova Distribuidora</h1><small>Gestão de estoque, vendas e financeiro</small></div><span>Versão de testes</span></header><nav id="nav"></nav><main id="app"></main><footer>Dados de teste armazenados neste navegador. Integrações bancárias aguardam habilitação.</footer><script src="./app.js"></script></body>
</html>
